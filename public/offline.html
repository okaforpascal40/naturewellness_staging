<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're offline — NatureWellness</title>
    <meta name="theme-color" content="#2D6A4F" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
      /* Inlined rather than linked: a stylesheet request would fail offline.
         Values mirror the app tokens in src/index.css. */
      :root {
        --background: #f8faf9;
        --foreground: #1c2b24;
        --primary: #2d6a4f;
        --muted-foreground: #5c6b64;
        --border: #dde5e1;
        --card: #ffffff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--background);
        color: var(--foreground);
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 30rem;
        text-align: center;
      }
      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(45, 106, 79, 0.1);
        font-size: 34px;
        line-height: 1;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--primary);
      }
      .brand {
        margin: 0 0 24px;
        font-size: 0.8125rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted-foreground);
      }
      p {
        margin: 0 0 20px;
        font-size: 1rem;
        line-height: 1.6;
        color: var(--muted-foreground);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 20px;
        text-align: left;
      }
      .card h2 {
        margin: 0 0 12px;
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--foreground);
      }
      .links {
        display: grid;
        gap: 10px;
      }
      a {
        display: block;
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--background);
        color: var(--primary);
        font-size: 0.9375rem;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover,
      a:focus-visible {
        border-color: var(--primary);
        background: rgba(45, 106, 79, 0.08);
      }
      button {
        width: 100%;
        padding: 14px 16px;
        border: none;
        border-radius: 12px;
        background: var(--primary);
        color: #fff;
        font-family: inherit;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #24563f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0e1512;
          --foreground: #e8efeb;
          --primary: #4bb383;
          --muted-foreground: #9aada4;
          --border: #23302a;
          --card: #141d19;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">🌿</div>
      <h1>You're offline</h1>
      <p class="brand">NatureWellness 47:12</p>
      <p>
        We can't reach the evidence databases right now. Your saved conditions are
        still available on this device.
      </p>

      <div class="card">
        <h2>Available offline</h2>
        <div class="links">
          <a href="/favorites">★ Saved Favorites</a>
          <a href="/history">🕘 Recent History</a>
        </div>
      </div>

      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>

    <script>
      // The offline page is served from the cache by the service worker, so it
      // can still be showing after the connection returns. Reload on reconnect.
      window.addEventListener("online", function () {
        window.location.replace("/");
      });
    </script>
  </body>
</html>
