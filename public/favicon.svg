<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="NatureWellness">
  <title>NatureWellness</title>
  <!--
    Favicon, drawn for 16x16 first. The navbar logo's veins, accent leaves and
    gold seeds all collapse into noise at tab size, so this keeps only what
    survives: the leaf silhouette, a single midrib, and maximum contrast.
    Full-bleed circle — a favicon with padding reads smaller than its neighbours.
  -->
  <circle cx="16" cy="16" r="16" fill="#2D6A4F"/>
  <!-- Same tip-up, round-bottomed silhouette as the navbar mark, rescaled. -->
  <path d="M16 6C16 6 25.5 11.5 25.5 19C25.5 23.8 21.2 26.8 16 26.8C10.8 26.8 6.5 23.8 6.5 19C6.5 11.5 16 6 16 6Z"
        fill="#FFFFFF"/>
  <!-- Midrib in the background green: at small sizes this is what makes the
       shape read as a leaf rather than a plain teardrop. -->
  <path d="M16 25.2V8.6" stroke="#2D6A4F" stroke-width="1.4" stroke-linecap="round"/>
</svg>
